# Manual scan (privacy-first).
#
# Scanning now runs LOCALLY by default so the intelligence it produces (target
# names, URLs) never lands in this public repo. This workflow is kept for a
# manual, on-demand run you can watch in the Actions tab — it prints results to
# the run log but does NOT commit them.
#
# If you later want persistent daily automation, do it in a *private* repo (or a
# private data store) so target data stays out of public view — then re-add the
# `schedule:` trigger and a commit step there.

name: Manual Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scan (results printed to the log only, not committed)
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        CIVITAI_ENABLED: ${{ vars.CIVITAI_ENABLED }}
      run: python src/main.py
